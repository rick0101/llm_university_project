files:
  - name: config.py
    generation_order: 1
    dependencies: []
    purpose: Hyperparameter configuration and global constants for security experiments.
    classes:
      - name: ExperimentConfig
        fields:
          - lr: 5e-5
          - batch_size: 16
          - max_seq_len: 512
          - adversarial_epsilon: 0.01
          - smooth_llm_samples: 10
          - ppl_threshold: 150.0
          - device: "cuda"
          - seeds: [42, 1337, 2024]
          - safety_reward_beta: 0.1
          - budget_hours: 48

  - name: data_utils.py
    generation_order: 2
    dependencies: [config.py]
    purpose: Dataset handling, tokenization, and adversarial perturbation logic.
    functions:
      - name: get_wiki_loaders
        signature: (config: ExperimentConfig) -> (train, val, test)
        pseudocode: |
          1. Load WikiText-103 using 'datasets' library
          2. Initialize GPT2Tokenizer or custom LSTM tokenizer
          3. Map tokenization over datasets: [B, S] where S=config.max_seq_len
          4. Create PyTorch DataLoaders with shuffle=True
          5. Return (train_loader, val_loader, test_loader)
      - name: apply_adversarial_perturbation
        signature: (input_ids: torch.Tensor, strength: float) -> torch.Tensor
        pseudocode: |
          1. input_ids shape: [B, S]
          2. For each sequence in batch:
             a. Identify non-special tokens
             b. Select 'strength' % of tokens to perturb
             c. Replace selected tokens with random vocabulary IDs or character-level swaps
          3. Return perturbed_ids [B, S]
      - name: get_harmfulness_scorer
        signature: () -> Callable
        pseudocode: |
          1. Load a pre-trained safety classifier (e.g., RoBERTa-based)
          2. Define scoring function: score = sigmoid(logits[harmful_class])
          3. Return function that takes string/tensor and returns float [0, 1]

  - name: model_zoo.py
    generation_order: 3
    dependencies: [config.py]
    purpose: Architecture definitions for baselines and defensive wrappers.
    classes:
      - name: SecurityModel(nn.Module)
        input_shape: "[B, S] (token IDs)"
        output_shape: "[B, S, V] (logits)"
        methods:
          - name: __init__
            pseudocode: |
              1. Initialize embedding layer [V, E]
              2. Initialize transformer blocks or LSTM cells
              3. Initialize language modeling head [E, V]
          - name: forward
            pseudocode: |
              1. x = self.embeddings(input_ids) # [B, S, E]
              2. x = self.backbone(x) # [B, S, E]
              3. logits = self.lm_head(x) # [B, S, V]
              4. return logits
      - name: SmoothLLMWrapper(nn.Module)
        differentiator: Implements input-smoothing defense by ensemble sampling.
        methods:
          - name: forward
            pseudocode: |
              1. input_ids: [B, S]
              2. Create N copies: [B*N, S] where N = config.smooth_llm_samples
              3. Apply random noise to copies (character/token swaps)
              4. Get logits for all: [B*N, S, V]
              5. Reshape to [B, N, S, V]
              6. Average logits across N dimension: [B, S, V]
              7. return averaged_logits
      - name: PerplexityFilterModel(nn.Module)
        differentiator: Rejects inputs with high perplexity before processing.
        methods:
          - name: forward
            pseudocode: |
              1. Compute log_probs using a frozen reference model: [B, S]
              2. Calculate perplexity: ppl = exp(-mean(log_probs))
              3. mask = (ppl < config.ppl_threshold).float() # [B, 1]
              4. logits = self.base_model(input_ids)
              5. # If masked, replace logits with 'Refusal' token distribution
              6. return logits * mask + refusal_logits * (1 - mask)

  - name: engine.py
    generation_order: 4
    dependencies: [config.py, model_zoo.py, data_utils.py]
    purpose: Specialized training logic for adversarial and safety alignment.
    classes:
      - name: BaseTrainer
        methods:
          - name: train_step
            pseudocode: |
              1. logits = model(input_ids)
              2. loss = CrossEntropy(logits.view(-1, V), labels.view(-1))
              3. loss.backward(); optimizer.step(); optimizer.zero_grad()
              4. return loss.item()
          - name: compute_metrics
            pseudocode: |
              1. Calculate Perplexity: exp(avg_loss)
              2. Calculate ASR: count(jailbreaks) / total
              3. Calculate Semantic Consistency: CosineSim(orig_emb, adv_emb)
              4. Return dict of metrics
      - name: AdversarialTrainer(BaseTrainer)
        overrides: [train_step]
        methods:
          - name: train_step
            pseudocode: |
              1. model.eval()
              2. Generate adversarial input_adv using FGSM on embeddings
              3. model.train()
              4. logits_adv = model(input_adv)
              5. loss_adv = CrossEntropy(logits_adv, labels)
              6. logits_clean = model(input_ids)
              7. loss_clean = CrossEntropy(logits_clean, labels)
              8. total_loss = 0.5 * (loss_adv + loss_clean)
              9. total_loss.backward(); optimizer.step()
              10. return total_loss.detach()
      - name: RLUFTrainer(BaseTrainer)
        overrides: [train_step]
        methods:
          - name: train_step
            pseudocode: |
              1. outputs = model.generate(input_ids) # [B, S_gen]
              2. log_probs = model(outputs).log_softmax(-1)
              3. rewards = -1.0 * safety_scorer(outputs) # Inverse of harmfulness
              4. policy_loss = -(log_probs * rewards.detach()).mean()
              5. kl_div = KL(current_model || ref_model)
              6. total_loss = policy_loss + config.safety_reward_beta * kl_div
              7. total_loss.backward(); optimizer.step()
              8. return total_loss.item()

  - name: main.py
    generation_order: 5
    dependencies: [config.py, data_utils.py, model_zoo.py, engine.py]
    purpose: Entry point orchestrating all experiment conditions and reporting.
    functions:
      - name: main
        pseudocode: |
          1. Print "METRIC_DEF: ASR | Harmfulness | PPL | Consistency"
          2. Print "REGISTERED_CONDITIONS: Baseline_GPT2, Adv_Training, RLUF, SmoothLLM, PPL_Filter"
          3. Initialize ExperimentConfig and start_time = time.time()
          4. Load data_loaders
          5. For condition in [BaselineCondition, AdvTrainCondition, RLUFCondition, SmoothCondition, PPLCondition]:
             a. Print f"Running {condition.name}"
             b. For seed in config.seeds:
                i. Check time: if time.time() - start_time > config.budget_hours * 3600: break
                ii. Set torch.manual_seed(seed)
                iii. model = condition.initialize_model()
                iv. trainer = condition.get_trainer(model)
                v. trainer.fit(data_loaders['train'])
                vi. results = trainer.evaluate(data_loaders['test'])
                vii. Print f"SEED {seed} METRICS: {results}"
             c. Calculate and print aggregate mean/std for condition
          6. Print "SUMMARY: Comparison of all conditions completed."

    classes:
      - name: BaselineCondition
        methods:
          - name: initialize_model
            pseudocode: return SecurityModel(gpt2_config)
          - name: get_trainer
            pseudocode: return BaseTrainer(model)
      - name: AdvTrainCondition
        methods:
          - name: initialize_model
            pseudocode: return SecurityModel(gpt2_config)
          - name: get_trainer
            pseudocode: return AdversarialTrainer(model)
      - name: RLUFCondition
        methods:
          - name: initialize_model
            pseudocode: return SecurityModel(gpt2_config)
          - name: get_trainer
            pseudocode: return RLUFTrainer(model)
      - name: SmoothCondition
        methods:
          - name: initialize_model
            pseudocode: return SmoothLLMWrapper(SecurityModel(gpt2_config))
          - name: get_trainer
            pseudocode: return BaseTrainer(model)
      - name: PPLCondition
        methods:
          - name: initialize_model
            pseudocode: return PerplexityFilterModel(SecurityModel(gpt2_config))
          - name: get_trainer
            pseudocode: return BaseTrainer(model)

verification_criteria:
  - "NumPy 2.x compliance: Using np.trapezoid for ASR curves if needed, Python built-ins for types."
  - "Separate classes for each condition: Baseline, AdvTrain, RLUF, SmoothLLM, PPLFilter."
  - "Strategy differentiation: RLUF uses RL loss, AdvTrain uses FGSM inner loop, SmoothLLM uses ensemble inference."
  - "Tensor shapes: Explicitly annotated in model_zoo.py [B, S, V] and [B, S, E]."
  - "Time budget: Guard implemented in main loop checking config.budget_hours."
  - "Gradient handling: .detach() used in RLUF rewards and adversarial loss tracking."