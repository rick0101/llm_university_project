# ============================================================================
# LLM Security Survey Generator — Configurazione Centralizzata
# ============================================================================
# API keys vanno nel file .env (mai commitare!)
# Tutto il resto è configurabile qui.
# ============================================================================

# --- Priorità Recency (globale) ---
# Se true, i paper più recenti ricevono priorità durante ingestion, retrieval e L2 summarization.
# Se false, tutti i paper vengono trattati allo stesso modo indipendentemente dall'anno.
recency_priority: true

# --- Modelli LLM (Gemini Advanced) ---
gemini:
  flash_model: "gemini-3-flash-preview"      # Task semplici: classificazione, reranking, estrazione entità
  pro_model: "gemini-3.1-pro-preview"          # Task complessi: summarization, writing, planning
  embedding_model: "gemini-embedding-2-preview"     # Embedding 3072-dim
  temperature_flash: 0.1                       # Bassa per task deterministici
  temperature_pro: 0.3                         # Leggermente più alta per writing creativo
  max_output_tokens_flash: 4096
  max_output_tokens_pro: 8192
  timeout: 600                                 # Timeout per singola chiamata (secondi) — thinking models richiedono più tempo
  max_retries: 3                               # Retry con backoff esponenziale
  # Strategia di retry in caso di errori Google API:
  #   "autonomous" → Solo Google API, retry infiniti con delay incrementali.
  #                   Il programma procede da solo senza intervento umano.
  #                   Ideale quando non si è davanti al PC.
  #   "interactive" → Dopo max_retries errori Google, chiede all'utente
  #                   se usare OpenRouter come fallback (più veloce ma costa).
  #                   Ideale quando si è davanti al PC e si vuole velocità.
  retry_strategy: "autonomous"

# --- GROBID (Docker) ---
grobid:
  base_url: "http://localhost:8070"
  timeout: 120                                 # Timeout per singolo PDF (secondi)
  batch_size: 10                               # PDF processati in parallelo
  consolidate_header: true                     # Consolidamento header con citations
  consolidate_citations: true                  # Consolidamento citazioni
  include_raw_citations: true                  # Includere citazioni raw nel TEI-XML
  # Docker: docker run --rm -p 8070:8070 lfoppiano/grobid:0.8.2-full

# --- Neo4j (Community Edition, opzionale) ---
neo4j:
  enabled: true                               # Impostare a true quando Neo4j è disponibile
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "password"                         # Cambiare in produzione
  database: "neo4j"
  # Docker: docker run --rm -p 7474:7474 -p 7687:7687 -e NEO4J_AUTH=neo4j/password neo4j:5-community

# --- Qdrant (Vector DB locale, no server needed) ---
qdrant:
  persist_dir: "./qdrant_db_test"                    # Storage locale su disco
  collection_paper_chunks: "paper_chunks"
  collection_l1_summaries: "l1_summaries"
  collection_l2_summaries: "l2_summaries"
  collection_l1_5_summaries: "l1_5_summaries"
  collection_graph_communities: "graph_communities"
  collection_figure_descriptions: "figure_descriptions"
  collection_image_embeddings: "image_embeddings"
  embedding_dimension: 3072                    # Gemini embedding-001 dimension
  distance_metric: "Cosine"                    # Cosine | Euclid | Dot

# --- Semantic Scholar API ---
semantic_scholar:
  base_url: "https://api.semanticscholar.org/graph/v1"
  rate_limit_rpm: 100                          # Richieste al minuto (free tier)
  rate_limit_rpm_authenticated: 100            # Con API key
  fields: "title,authors,year,venue,journal,citationCount,influentialCitationCount,fieldsOfStudy,publicationDate,externalIds,abstract,citationStyles"
  search_fields: "title,authors,year,venue,externalIds,abstract,citationCount"
  max_retries: 3
  timeout: 30
  cache_dir: "./cache/semantic_scholar"        # Cache locale risultati S2

# --- Ingestion Pipeline ---
ingestion:
  pdf_base_dir: "./scaricati_test"                  # Directory radice PDF categorizzati
  hash_registry_path: "./data/hash_registry.json"
  chunk_size: 1500                             # Token per chunk (approssimativo in caratteri)
  chunk_overlap: 200                           # Overlap tra chunk consecutivi
  batch_size: 10                               # PDF per batch durante ingestion
  fallback_to_pymupdf: false                    # Fallback a PyMuPDF se GROBID fallisce
  use_best_fit_packing: true                   # Best-fit bin packing post-segmentazione GROBID
  papers_per_category: 5                       # Numero target di paper per categoria (usato per budget)
  # Mapping nome cartella → nome categoria human-readable
  category_mapping:
    Prompt_injections1: "Prompt Injection"
    Hallucinations1: "LLM Hallucinations"
    Data_and_Model_Poisoning1: "Data and Model Poisoning"
    Adversarial_Code1: "Adversarial Attacks"

# --- Hierarchical Summarization ---
summarization:
  l1_max_tokens: 2000                          # Max token per summary L1
  l2_max_tokens: 6000                          # Max token per summary L2 (4-6k)
  l2_invalidation_threshold: 1                 # Minimo nuovi paper per triggerare rigenerazione L2
  use_pro_for_l1: true                         # Usa Pro per L1 (raccomandato)
  use_pro_for_l2: true                         # Usa Pro per L2 (raccomandato)
  allow_flash_fallback: false                   # Se false, insisti con Pro senza degradare a Flash
  pro_max_retries: 6                           # Retry pazienti per Pro (delay lunghi)
  pro_base_delay: 15                           # Delay base (sec) tra retry Pro
  max_context_tokens: 150000                   # Budget token massimo per singola chiamata LLM
  l1_target_chars_auto: true                   # Se true, calcola target L1 chars in base a papers_per_category
  l1_min_chars: 2000                           # Floor: un L1 non sarà mai più corto di così
  l2_recency_tiers:                            # Soglie di compressione per recency (anni fa)
    full: 2                                    # Paper ≤2 anni: testo L1 completo
    reduced: 4                                 # Paper 2-4 anni: ~70%
    compressed: 999                            # Paper >4 anni: solo key_contributions + testing

# --- Clustering (RAPTOR L1.5) ---
clustering:
  max_cluster_size: 20          # Massimo numero di paper per cluster L1.5
  similarity_threshold: 0.75    # Soglia similarità coseno per il clustering

# --- Figure Extraction (v3.1) ---
# Estrazione e descrizione intelligente delle figure dai PDF.
# Usa Gemini Flash Vision per generare descrizioni semantiche delle figure,
# che vengono poi indicizzate in Qdrant come vettori testuali.
figure_extraction:
  enabled: true                 # Abilita/disabilita estrazione figure
  vision_model: "google/gemini-3-flash-preview"  # Modello con supporto Vision multimodale
  min_width: 150                # Larghezza minima immagine (pixel) — esclude icone
  min_height: 150               # Altezza minima immagine (pixel) — esclude loghi
  max_figures_per_paper: 10     # Massimo figure processate per paper (le più grandi)
  figures_dir: "./output/figures"  # Directory dove salvare le immagini estratte

# --- Hybrid Retrieval ---
retrieval:
  vector_weight: 0.6                           # Peso ricerca vettoriale in RRF
  bm25_weight: 0.3                             # Peso BM25 in RRF
  graph_weight: 0.1                            # Peso GraphRAG in RRF (se abilitato)
  top_k_vector: 20                             # Candidati dalla ricerca vettoriale
  top_k_bm25: 20                               # Candidati dal BM25
  top_k_final: 10                              # Risultati finali dopo reranking
  rerank_batch_size: 20                        # Max candidati per batch di reranking
  bm25_index_path: "./data/bm25_index.pkl"
  recency_boost: 0.1                           # Boost temporale post-RRF (0.0=disabilitato)
  # --- Venue Ranking ---
  venue_ranking_enabled: true                  # Abilita boost per venue autorevoli
  venue_tier1_boost: 0.15                      # +0.15 per NeurIPS/ICML/ACL/IEEE S&P
  venue_tier2_boost: 0.05                      # +0.05 per workshop ufficiali/AAAI
  venue_tier3_penalty: 0.05                    # -0.05 per arXiv preprint

# --- Agentic Writing Pipeline ---
agents:
  max_writer_iterations: 3                     # Max iterazioni writer↔critic per sezione
  min_section_words: 500                       # Minimo parole per sezione
  max_section_words: 3000                      # Massimo parole per sezione
  verification_threshold: 0.80                 # % citazioni supportate per passare
  planner_model: "pro"                         # Modello per il Planner (pro raccomandato)
  writer_model: "pro"                          # Modello per il Writer
  critic_model: "flash"                        # Modello per il Critic (flash sufficiente)
  assembler_model: "pro"                       # Modello per l'Assembler
  writer_max_context_chars: 60000              # Max chars contesto per singola sezione writer
  writer_budget_mode: "proportional"           # "fixed" | "proportional" (divide budget per N sezioni)
  writer_mode: "agentic"                        # "static" (RAG pre-calcolato) | "agentic" (ReAct multi-step)

# --- Output & Post-processing ---
output:
  base_dir: "./output"
  versions_dir: "./output/versions"
  checkpoints_dir: "./output/.checkpoints"
  provenance_dir: "./output/provenance"
  latex_template: "acl"                        # acl | ieeetran | plain
  generate_latex: true
  generate_bibtex: true
  generate_provenance_json: true

# --- Search (legacy PaperHunter) ---
search:
  max_results_per_source: 20
  default_categories:
    - "cs.CL"
    - "cs.AI"
    - "cs.CR"
    - "cs.LG"

# --- Download ---
download:
  download_dir: "./scaricati"
  timeout: 30
  headless: true
  request_delay: 1.0
  playwright_delay: 2.0

# --- OpenRouter Fallback ---
# Se abilitato, quando tutte le retry con l'API Google falliscono,
# il sistema usa automaticamente OpenRouter come provider di fallback.
# Richiede OPENROUTER_API_KEY nel file .env
openrouter:
  enabled: true                                # Abilita fallback a OpenRouter
  api_base: "https://openrouter.ai/api/v1"
  flash_model: "google/gemini-3-flash-preview"   # Modello economico (equivalente Flash)
  pro_model: "google/gemini-3.1-pro-preview" # Modello potente (equivalente Pro)
  temperature_flash: 0.1
  temperature_pro: 0.3
  max_output_tokens_flash: 4096
  max_output_tokens_pro: 8192
  timeout: 300                                 # Timeout in secondi
  max_retries: 3                               # Retry con OpenRouter

# --- Rate Limiting Globale ---
rate_limiting:
  gemini_rpm: 15                               # Gemini free tier: ~15 RPM
  gemini_daily_limit: 1500                     # Limite giornaliero approssimativo
  semantic_scholar_rpm: 100
  grobid_concurrent: 5                         # Richieste GROBID concorrenti

# --- Image Filtering (Pipeline a 3 stadi) ---
# Filtraggio intelligente delle immagini estratte dai PDF.
# Stage 1: Filtro euristico locale (PIL + NumPy, zero costi API)
# Stage 2: Filtro embedding multimodale (Gemini Embedding 2 Preview)
# Stage 3: Descrizione Vision (solo immagini rilevanti)
image_filtering:
  enabled: true                          # Abilita/disabilita il filtraggio intelligente
  # --- Filtro Euristico (Stage 1) ---
  min_aspect_ratio: 0.3                  # Min w/h — filtra barre verticali
  max_aspect_ratio: 4.0                  # Max w/h — filtra banner orizzontali
  min_color_entropy: 3.0                 # Entropia Shannon minima (scala 0-8 per 8-bit)
  min_edge_density: 0.05                 # Percentuale minima pixel bordo (0.0-1.0)
  skip_first_page: true                  # Penalizza immagini dalla prima pagina (loghi)
  skip_last_page: true                   # Penalizza immagini dall'ultima pagina (copyright)
  relevance_threshold: 0.5               # Soglia punteggio combinato [0.0, 1.0]
  # --- Filtro Embedding Multimodale (Stage 2) ---
  embedding_filter_enabled: true         # Abilita filtro via embedding multimodale
  embedding_similarity_threshold: 0.3    # Soglia coseno minima vs riferimenti scientifici

# --- Logging ---
logging:
  level: "INFO"                                # DEBUG | INFO | WARNING | ERROR
  rich_enabled: true                           # Usa rich per output formattato
  log_file: "./logs/paperhunter.log"           # File di log (opzionale, stringa vuota per disabilitare)
  show_progress_bars: true                     # Progress bar con rich/tqdm
